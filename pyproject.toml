[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG Assistant with LangGraph, Groq, Qdrant, and Tavily"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]
